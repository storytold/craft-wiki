name: Trigger Cloudflare deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit
      - name: Trigger Cloudflare build
        env:
          DEPLOY_HOOK: ${{ vars.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "CLOUDFLARE_DEPLOY_HOOK is not configured" >&2
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK"
