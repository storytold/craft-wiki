sonar.projectKey=storytold_craft-wiki
sonar.organization=storytold

# Sources and tests both start at the root (see lightcraft); the worker's node:test file is a test.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.test.mjs

# Written by `npm run test:coverage`, which the SonarCloud workflow runs (node-coverage-script).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# The Astro site (pages, components, content and its build scripts) has no unit tests; coverage
# measures the worker, which serves the API and auth.
sonar.coverage.exclusions=src/**,scripts/**,astro.config.mjs

# githubactions:S7637 asks for every action to be pinned to a commit SHA. A workflow covered by
# .github/workflows/actions.lock runs the commit the lockfile records, so its tag refs are pinned
# and the lockfile covers the actions those actions use too. Sonar does not read lockfiles yet, so
# the rule flags the tag refs anyway:
# https://community.sonarsource.com/t/githubactions-s7637-false-positives-for-actions-pinned-through-native-actions-lock/190814
# Reusable workflow calls are not pinned by actions.lock; keep S7637 enabled for them.
sonar.issue.ignore.multicriteria=gha-deploy,gha-safebrowsing,gha-worker-tests,gha-lockfile
sonar.issue.ignore.multicriteria.gha-deploy.ruleKey=githubactions:S7637
sonar.issue.ignore.multicriteria.gha-deploy.resourceKey=.github/workflows/deploy.yml
sonar.issue.ignore.multicriteria.gha-safebrowsing.ruleKey=githubactions:S7637
sonar.issue.ignore.multicriteria.gha-safebrowsing.resourceKey=.github/workflows/safebrowsing.yml
sonar.issue.ignore.multicriteria.gha-worker-tests.ruleKey=githubactions:S7637
sonar.issue.ignore.multicriteria.gha-worker-tests.resourceKey=.github/workflows/worker-tests.yml
sonar.issue.ignore.multicriteria.gha-lockfile.ruleKey=githubactions:S7637
sonar.issue.ignore.multicriteria.gha-lockfile.resourceKey=.github/workflows/lockfile.yml
