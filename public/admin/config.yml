backend:
  name: github
  repo: storytold/craft-wiki
  branch: main
  api_root: https://craft.wiki/api/github
  base_url: https://craft.wiki
  auth_endpoint: api/auth
  auth_methods: [oauth, token]
  auth_scope: public_repo
  open_authoring: true
publish_mode: editorial_workflow
output:
  omit_empty_optional_fields: true
media_folder: public/assets/uploads
public_folder: /assets/uploads
collections:
  - name: artcraft-studio
    label: ArtCraft Studio
    folder: src/content/docs/apps/artcraft-studio
    publish_mode: simple
    create: true
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: string, required: false }
      - { label: Sidebar section, name: parent, widget: select, options: [{ label: Workflows, value: workflows }], required: false, hint: "Choose Workflows to list this page under Workflows in the sidebar. Leave it empty to list the page at the top level." }
      - { label: Sidebar, name: sidebar, widget: object, required: false, fields: [{ label: Order, name: order, widget: number, value_type: float, required: false, hint: "The sidebar and the previous and next links sort pages by this number. Pick a number between those of the pages before and after this one. A page without a number is listed after the numbered pages." }] }
      - { label: Body, name: body, widget: markdown }
  - name: photocraft
    label: PhotoCraft
    folder: src/content/docs/apps/photocraft
    publish_mode: simple
    create: true
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: string, required: false }
      - { label: Sidebar section, name: parent, widget: select, options: [{ label: Workflows, value: workflows }], required: false, hint: "Choose Workflows to list this page under Workflows in the sidebar. Leave it empty to list the page at the top level." }
      - { label: Sidebar, name: sidebar, widget: object, required: false, fields: [{ label: Order, name: order, widget: number, value_type: float, required: false, hint: "The sidebar and the previous and next links sort pages by this number. Pick a number between those of the pages before and after this one. A page without a number is listed after the numbered pages." }] }
      - { label: Body, name: body, widget: markdown }
  - name: vectorcraft
    label: VectorCraft
    folder: src/content/docs/apps/vectorcraft
    publish_mode: simple
    create: true
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: string, required: false }
      - { label: Page type, name: type, widget: select, options: [{ label: Overview, value: overview }, { label: Guide, value: guide }, { label: Reference, value: reference }, { label: Troubleshooting, value: troubleshooting }], required: false }
      - { label: Category, name: category, widget: select, options: ["Get started", "Documents and artboards", "View and navigate", "Select and transform", "Draw and edit", "Images and data", "Color and paint", "Effects and appearance", "Type", "Organize", "Files and formats", "Export", "Print and color management", "Automate", "Customize and extend", "Reference"], required: false, hint: "The sidebar and the guide cards group pages by category." }
      - { label: Subcategory, name: subcategory, widget: string, required: false, hint: "A smaller group inside the category on the guide cards." }
      - { label: Card picture, name: cover, widget: image, media_folder: /public/assets/uploads/vectorcraft, public_folder: /assets/uploads/vectorcraft, required: false, hint: "A screenshot from this page. Cards crop it to 16:10 from the top." }
      - { label: Card summary, name: summary, widget: string, required: false, hint: "One line for the guide card. The card shows the description when this is empty." }
      - { label: Sidebar section, name: parent, widget: select, options: [{ label: Workflows, value: workflows }], required: false, hint: "Choose Workflows to list this page under Workflows in the sidebar. Leave it empty to list the page at the top level." }
      - { label: Sidebar, name: sidebar, widget: object, required: false, fields: [{ label: Order, name: order, widget: number, value_type: float, required: false, hint: "The sidebar and the previous and next links sort pages by this number. Pick a number between those of the pages before and after this one. A page without a number is listed after the numbered pages." }] }
      - { label: Body, name: body, widget: markdown }
